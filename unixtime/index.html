<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">Unix 时间戳转换工具</h1><p class="tool-desc">支持秒级和毫秒级时间戳与本地时间互转，适合接口、日志和数据库时间排查。</p><div class="form-group"><input id="timestamp" class="form-control" placeholder="输入 10 位秒级或 13 位毫秒级时间戳"/></div><div class="form-group text-center"><button class="btn btn-success" onclick="tsToDate()">时间戳转时间</button> <button class="btn btn-primary" onclick="nowTime()">当前时间戳</button></div><div class="result-box" id="result"></div><hr/><div class="form-group"><input id="dateInput" class="form-control" placeholder="输入时间，例如 2026-05-24 12:00:00"/></div><div class="form-group text-center"><button class="btn btn-default" onclick="dateToTs()">时间转时间戳</button> <button class="btn btn-default" onclick="clearAll()">清空</button></div><div class="footer-links"><a href="/unix-time-guide.html">时间戳说明</a><a href="/time-tools-guide.html">时间工具指南</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>function show(d){document.getElementById('result').innerHTML=d}function tsToDate(){var v=document.getElementById('timestamp').value.trim();if(!/^\d+$/.test(v)){show('请输入数字时间戳');return}var n=Number(v.length===13?v:Number(v)*1000),d=new Date(n);show('本地时间：'+d.toLocaleString()+'<br>ISO 时间：'+d.toISOString()+'<br>秒级：'+Math.floor(n/1000)+'<br>毫秒级：'+n)}function nowTime(){var n=Date.now();document.getElementById('timestamp').value=n;show('当前秒级：'+Math.floor(n/1000)+'<br>当前毫秒级：'+n+'<br>本地时间：'+new Date(n).toLocaleString())}function dateToTs(){var d=new Date(document.getElementById('dateInput').value.replace(/-/g,'/'));if(isNaN(d.getTime())){show('时间格式无法识别');return}show('秒级：'+Math.floor(d.getTime()/1000)+'<br>毫秒级：'+d.getTime()+'<br>本地时间：'+d.toLocaleString())}function clearAll(){document.getElementById('timestamp').value='';document.getElementById('dateInput').value='';show('')}</script>
