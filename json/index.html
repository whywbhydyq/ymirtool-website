<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">JSON 格式化、校验与压缩工具</h1><p class="tool-desc">粘贴 JSON 后可进行格式化、压缩和基础校验，适合接口调试、日志排查和配置检查。</p><div class="row"><div class="col-sm-6"><textarea id="source" class="form-control" rows="18" placeholder="输入 JSON 内容"></textarea></div><div class="col-sm-6"><textarea id="result" class="form-control" rows="18" placeholder="处理结果" readonly></textarea></div></div><div class="form-group text-center" style="margin-top:15px"><button class="btn btn-success" onclick="formatJson()">格式化</button> <button class="btn btn-primary" onclick="minifyJson()">压缩</button> <button class="btn btn-default" onclick="copyText()">复制结果</button> <button class="btn btn-default" onclick="clearAll()">清空</button></div><div class="footer-links"><a href="/json-formatter-examples.html">JSON 示例与排查</a><a href="/jsonzip/">JSON 压缩转义</a><a href="/json2yaml/">JSON 转 YAML</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>
function parseInput(){return JSON.parse(document.getElementById('source').value)}
function formatJson(){try{document.getElementById('result').value=JSON.stringify(parseInput(),null,2)}catch(e){alert('JSON 格式错误：'+e.message)}}
function minifyJson(){try{document.getElementById('result').value=JSON.stringify(parseInput())}catch(e){alert('JSON 格式错误：'+e.message)}}
function copyText(){var r=document.getElementById('result');r.select();document.execCommand('copy')}
function clearAll(){document.getElementById('source').value='';document.getElementById('result').value=''}
</script>
