<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">JavaScript 格式化与压缩工具</h1><p class="tool-desc">粘贴 JavaScript 片段后可进行基础格式化或压缩。格式化用于提高可读性，不等于代码安全审计。</p><div class="row"><div class="col-sm-6"><textarea id="source" class="form-control" rows="18" placeholder="输入 JavaScript 代码"></textarea></div><div class="col-sm-6"><textarea id="result" class="form-control" rows="18" placeholder="处理结果" readonly></textarea></div></div><div class="form-group text-center" style="margin-top:15px"><button class="btn btn-success" onclick="formatJs()">格式化</button> <button class="btn btn-primary" onclick="minifyJs()">压缩</button> <button class="btn btn-default" onclick="copyText()">复制结果</button> <button class="btn btn-default" onclick="clearAll()">清空</button></div><div class="footer-links"><a href="/javascript-formatter-guide.html">JavaScript 使用说明</a><a href="/formathtml/">HTML 格式化</a><a href="/formatcss/">CSS 格式化</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>
function basicFormat(code){var out='',indent=0,str=null,esc=false;for(var i=0;i<code.length;i++){var c=code[i];if(str){out+=c;if(esc){esc=false}else if(c==='\\'){esc=true}else if(c===str){str=null}continue}if(c==='"'||c==="'"||c==='`'){str=c;out+=c;continue}if(c==='{'||c==='['||c==='('){out+=c+'\n'+Array(++indent+1).join('  ');continue}if(c==='}'||c===']'||c===')'){out+='\n'+Array(Math.max(--indent,0)+1).join('  ')+c;continue}if(c===';'){out+=c+'\n'+Array(indent+1).join('  ');continue}if(c===','){out+=c+' ';continue}if(!/\s/.test(c)||!out.endsWith(' '))out+=c}return out.replace(/\n\s*\n/g,'\n').trim()}
function basicMinify(code){return code.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|[^:])\/\/.*$/gm,'$1').replace(/\s+/g,' ').replace(/\s*([{}()[\];,:+\-*/%<>=!&|?])\s*/g,'$1').trim()}
function formatJs(){document.getElementById('result').value=basicFormat(document.getElementById('source').value)}
function minifyJs(){document.getElementById('result').value=basicMinify(document.getElementById('source').value)}
function copyText(){var r=document.getElementById('result');r.select();document.execCommand('copy')}
function clearAll(){document.getElementById('source').value='';document.getElementById('result').value=''}
</script>
