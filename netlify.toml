[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Reporting-Endpoints = 'ymir-csp-report="/api/csp-report"'
    Report-To = '{"group":"ymir-csp-report","max_age":604800,"endpoints":[{"url":"/api/csp-report"}],"include_subdomains":true}'
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://pagead2.googlesyndication.com https://cdn.vercel-insights.com; style-src 'self'; img-src 'self' https://pagead2.googlesyndication.com data: blob:; font-src 'self' data:; connect-src 'self' https://vitals.vercel-insights.com https://pagead2.googlesyndication.com ws: wss:; frame-src 'self' data: blob:; worker-src 'self' blob:; upgrade-insecure-requests; report-uri /api/csp-report; report-to ymir-csp-report"

[[redirects]]
  from = "/api/csp-report"
  to = "/.netlify/functions/csp-report"
  status = 200
  force = true
