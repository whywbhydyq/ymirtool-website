<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">URL 编码解码工具</h1><p class="tool-desc">输入文本、参数值或 URL 片段后进行 URL 编码或解码。完整 URL 与单个参数值的处理方式可能不同。</p><div class="form-group"><textarea id="source" class="form-control" rows="8" placeholder="输入需要 URL 编码或解码的内容"></textarea></div><div class="form-group text-center"><button class="btn btn-success" onclick="encodeUrl()">URL 编码</button> <button class="btn btn-primary" onclick="decodeUrl()">URL 解码</button> <button class="btn btn-default" onclick="copyText()">复制结果</button> <button class="btn btn-default" onclick="clearAll()">清空</button></div><div class="form-group"><textarea id="result" class="form-control" rows="8" placeholder="处理结果" readonly></textarea></div><div class="footer-links"><a href="/url-encoding-guide.html">URL 编码说明</a><a href="/json2get/">JSON 和 GET 参数互转</a><a href="/unicode/">Unicode / ASCII 转换</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>
function encodeUrl(){document.getElementById('result').value=encodeURIComponent(document.getElementById('source').value)}
function decodeUrl(){try{document.getElementById('result').value=decodeURIComponent(document.getElementById('source').value.replace(/\+/g,'%20'))}catch(e){alert('URL 编码内容无效或不完整')}}
function copyText(){var r=document.getElementById('result');r.select();document.execCommand('copy')}
function clearAll(){document.getElementById('source').value='';document.getElementById('result').value=''}
</script>
