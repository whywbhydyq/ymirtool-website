<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">Base64 编码解码工具</h1><p class="tool-desc">输入文本后进行 Base64 编码或解码。Base64 只是编码方式，不提供保密能力。</p><div class="form-group"><textarea id="source" class="form-control" rows="8" placeholder="输入需要编码或解码的文本"></textarea></div><div class="form-group text-center"><button class="btn btn-success" onclick="encodeText()">Base64 编码</button> <button class="btn btn-primary" onclick="decodeText()">Base64 解码</button> <button class="btn btn-default" onclick="copyText()">复制结果</button> <button class="btn btn-default" onclick="clearAll()">清空</button></div><div class="form-group"><textarea id="result" class="form-control" rows="8" placeholder="处理结果" readonly></textarea></div><div class="footer-links"><a href="/base64-encoding-guide.html">Base64 使用说明</a><a href="/img2base64/">图片转 Base64</a><a href="/urlencode/">URL 编码/解码</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>
function utf8ToBase64(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin)}
function base64ToUtf8(str){var bin=atob(str.replace(/\s+/g,'')),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function encodeText(){document.getElementById('result').value=utf8ToBase64(document.getElementById('source').value)}
function decodeText(){try{document.getElementById('result').value=base64ToUtf8(document.getElementById('source').value)}catch(e){alert('Base64 内容无效或不完整')}}
function copyText(){var r=document.getElementById('result');r.select();document.execCommand('copy')}
function clearAll(){document.getElementById('source').value='';document.getElementById('result').value=''}
</script>
