<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">正则表达式测试工具</h1><p class="tool-desc">输入正则表达式和测试文本，查看匹配结果。不同编程语言的正则规则可能存在差异。</p><div class="form-group"><input id="pattern" class="form-control" placeholder="正则表达式，例如：\d+"/></div><div class="form-group"><label><input type="checkbox" id="flagG" checked/> 全局匹配</label> <label><input type="checkbox" id="flagI"/> 忽略大小写</label> <label><input type="checkbox" id="flagM"/> 多行模式</label></div><div class="form-group"><textarea id="source" class="form-control" rows="10" placeholder="输入测试文本"></textarea></div><div class="form-group text-center"><button class="btn btn-success" onclick="testRegex()">测试匹配</button> <button class="btn btn-default" onclick="clearAll()">清空</button></div><div id="result" class="result-box"></div><div class="footer-links"><a href="/regex-tester-guide.html">正则测试说明</a><a href="/txtreplace/">文本替换</a><a href="/regexsucha/">正则语法速查</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>function testRegex(){var flags='';if(document.getElementById('flagG').checked)flags+='g';if(document.getElementById('flagI').checked)flags+='i';if(document.getElementById('flagM').checked)flags+='m';try{var re=new RegExp(document.getElementById('pattern').value,flags),s=document.getElementById('source').value,matches=[],m;if(flags.indexOf('g')>-1){while((m=re.exec(s))!==null){matches.push('匹配 '+matches.length+': '+m[0]);if(m.index===re.lastIndex)re.lastIndex++}}else{m=re.exec(s);if(m)matches.push('匹配: '+m[0])}document.getElementById('result').innerText=matches.length?matches.join('\n'):'没有匹配结果'}catch(e){document.getElementById('result').innerText='正则错误：'+e.message}}function clearAll(){document.getElementById('pattern').value='';document.getElementById('source').value='';document.getElementById('result').innerText=''}</script>
