<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">文本对比工具</h1><p class="tool-desc">粘贴两段文本后进行逐行对比，适合核对配置、日志、文案和代码片段。</p><div class="row"><div class="col-sm-6"><textarea id="left" class="form-control" rows="12" placeholder="原始文本"></textarea></div><div class="col-sm-6"><textarea id="right" class="form-control" rows="12" placeholder="新文本"></textarea></div></div><div class="form-group text-center" style="margin-top:15px"><button class="btn btn-success" onclick="compareText()">开始对比</button> <button class="btn btn-default" onclick="clearAll()">清空</button></div><div id="result" style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff"></div><div class="footer-links"><a href="/text-diff-guide.html">文本对比说明</a><a href="/txtreplace/">文本替换</a><a href="/txtcount/">字数统计</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function compareText(){var a=document.getElementById('left').value.split('\n'),b=document.getElementById('right').value.split('\n'),n=Math.max(a.length,b.length),html='';for(var i=0;i<n;i++){var l=a[i]||'',r=b[i]||'';if(l===r){html+='<div class="diff-line same">'+(i+1)+'. '+esc(l)+'</div>'}else{if(l)html+='<div class="diff-line del">- '+esc(l)+'</div>';if(r)html+='<div class="diff-line add">+ '+esc(r)+'</div>'}}document.getElementById('result').innerHTML=html||'<div class="diff-line same">无内容</div>'}function clearAll(){document.getElementById('left').value='';document.getElementById('right').value='';document.getElementById('result').innerHTML=''}</script>
