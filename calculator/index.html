<main class="container tool-wrap"><div class="tool-card"><h1 class="tool-title">在线计算器</h1><p class="tool-desc">支持加、减、乘、除、百分比和小数计算。重要结果建议结合原始条件复核。</p><div id="display" class="display">0</div><div class="keys"><button class="btn btn-default" onclick="clearAll()">C</button><button class="btn btn-default" onclick="toggleSign()">±</button><button class="btn btn-default" onclick="percent()">%</button><button class="btn btn-primary" onclick="setOp('/')">÷</button><button class="btn btn-default" onclick="inputNum('7')">7</button><button class="btn btn-default" onclick="inputNum('8')">8</button><button class="btn btn-default" onclick="inputNum('9')">9</button><button class="btn btn-primary" onclick="setOp('*')">×</button><button class="btn btn-default" onclick="inputNum('4')">4</button><button class="btn btn-default" onclick="inputNum('5')">5</button><button class="btn btn-default" onclick="inputNum('6')">6</button><button class="btn btn-primary" onclick="setOp('-')">−</button><button class="btn btn-default" onclick="inputNum('1')">1</button><button class="btn btn-default" onclick="inputNum('2')">2</button><button class="btn btn-default" onclick="inputNum('3')">3</button><button class="btn btn-primary" onclick="setOp('+')">+</button><button class="btn btn-default" onclick="inputNum('0')">0</button><button class="btn btn-default" onclick="inputDot()">.</button><button class="btn btn-default" onclick="backspace()">⌫</button><button class="btn btn-success" onclick="equals()">=</button></div><div class="footer-links"><a href="/calculator-guide.html">计算器说明</a><a href="/calculator-tools-guide.html">计算工具指南</a><a href="/privacy.html">隐私政策</a></div></div></main>

<script>
var current='0';var stored=null;var op=null;var fresh=false;
function show(){document.getElementById('display').innerText=current}
function clean(n){if(!isFinite(n))return '错误';var s=String(Math.round((n+Number.EPSILON)*1000000000000)/1000000000000);return s.length>18?Number(s).toExponential(10):s}
function inputNum(n){if(current==='错误'||fresh){current=n;fresh=false}else{current=current==='0'?n:current+n}show()}
function inputDot(){if(current==='错误'||fresh){current='0.';fresh=false}else if(current.indexOf('.')===-1){current+='.'}show()}
function clearAll(){current='0';stored=null;op=null;fresh=false;show()}
function backspace(){if(current==='错误'||fresh){current='0';fresh=false}else{current=current.length>1?current.slice(0,-1):'0'}show()}
function toggleSign(){if(current!=='0'&&current!=='错误'){current=current.charAt(0)==='-'?current.slice(1):'-'+current}show()}
function percent(){if(current!=='错误'){current=clean(Number(current)/100)}show()}
function apply(a,b,o){if(o==='+')return a+b;if(o==='-')return a-b;if(o==='*')return a*b;if(o==='/')return b===0?NaN:a/b;return b}
function setOp(next){var value=Number(current);if(stored!==null&&op&&!fresh){stored=apply(stored,value,op);current=clean(stored)}else{stored=value}op=next;fresh=true;show()}
function equals(){if(stored===null||!op)return;var value=Number(current);var result=apply(stored,value,op);current=clean(result);stored=null;op=null;fresh=true;show()}
show();
</script>
